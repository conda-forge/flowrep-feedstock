schema_version: 1

context:
  name: flowrep
  version: "0.6.2"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flowrep-${{ version }}.tar.gz
  sha256: 9d3d84db66e5cfc94f8f5e1543a56c523f35394b45a1cf405912786157e31696

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - packaging >=24.2,<=26.2
    - pydantic >=2.12.0,<2.13.0
    - pyiron_snippets >=1.3.0,<2.0.0
    - typing_extensions >=4.14.1,<4.17.0
tests:
  - python:
      imports:
        - flowrep
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: flowrep - Your premier tool for workflow representations
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/flowrep/

extra:
  recipe-maintainers:
    - samwaseda
    - jan-janssen
    - liamhuber
